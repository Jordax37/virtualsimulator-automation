<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Finaliser le compte — Virtual Admin</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f7f9fa;
    color: #1a2b3c;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
  }
  .card {
    background: white;
    border: 1px solid #e5e9eb;
    border-radius: 10px;
    padding: 32px;
    width: 340px;
  }
  h1 { font-size: 16px; margin: 0 0 18px; text-align: center; }
  label { font-size: 11.5px; color: #445; display: block; margin: 0 0 4px; }
  input {
    width: 100%; padding: 9px 10px; border: 1px solid #d5dde0; border-radius: 6px;
    font-size: 13px; margin-bottom: 14px;
  }
  button {
    width: 100%; padding: 11px; background: #7a3fe0; color: white; border: none;
    border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  #status { margin-top: 12px; font-size: 11.5px; color: #9c2b2b; min-height: 16px; text-align: center; }
  #message-section { text-align: center; font-size: 13px; color: #445; }
  #message-section.error { color: #9c2b2b; }
</style>
</head>
<body>
  <div class="card">
    <div id="message-section">Traitement du lien en cours...</div>
    <div id="password-form-section" hidden>
      <h1 id="form-title">Choisissez votre mot de passe</h1>
      <form id="password-form">
        <label for="new-password">Nouveau mot de passe</label>
        <input type="password" id="new-password" autocomplete="new-password" required minlength="8" />
        <button type="submit">Valider</button>
      </form>
      <div id="status"></div>
    </div>
  </div>

  <script type="module" src="callback.js"></script>
</body>
</html>
